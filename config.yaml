# Central configuration. Code reads values from here, never hard-codes them.

app:
  name: "AI Finance Assistant"
  disclaimer: >
    This assistant provides financial education only. It is not financial,
    investment, or tax advice. Consult a licensed professional before
    making financial decisions.
  log_level: INFO

llm:
  provider: openai            # gemini | openai
  model: gpt-6-luna    # if Google has retired this name, pick a current Flash model in AI Studio
  temperature: null
  max_retries: 3
  roles:                      # per-role overrides merged over llm.*
    router:
      model: gpt-6-luna
    synthesizer:
      model: gpt-6-luna
    finance_qa_rewrite:         # Finance Q&A query rewriting (own role so its usage is counted by agent)
      model: gpt-6-luna
    finance_qa:                 # Finance Q&A grounded answer
      model: gpt-6-luna
    portfolio_summary:          # Portfolio agent: plain-language summary of computed metrics
      model: gpt-6-luna
    market_summary:             # Market agent: plain-language summary of computed trend metrics
      model: gpt-6-luna
    goal_summary:               # Goal Planning agent: short commentary on computed projections
      model: gpt-6-luna

pricing:                      # USD per 1M tokens, keyed by model ID
  gpt-6-luna:
    input: 0.10
    output: 0.50
  gpt-5.4-mini:
    input: 0.75
    output: 4.50

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

rag:
  knowledge_base_dir: src/data/knowledge_base
  vector_store_dir: src/rag/vector_store
  vector_store: faiss         # faiss | chroma | pinecone (only faiss is built)
  # TUNED by tests/rag_eval (architecture section 5.3, README "RAG tuning results")
  chunk_size: 300
  chunk_overlap: 120
  topic_chunking:             # per-topic overrides of chunk_size/chunk_overlap (starting values, tunable)
    glossary: {chunk_size: 250, chunk_overlap: 0}
  top_k: 6
  score_threshold: 0.30
  max_chunks_per_article: 2   # diversity cap: at most this many chunks from one article (0/null = off)
  max_chunks_per_topic:       # per-topic caps (empty = off); glossary entries are tiny and many match at once
    glossary: 1
  topics:
    - stocks
    - bonds
    - etfs_and_funds
    - risk_and_diversification
    - goals_and_retirement
    - accounts_and_taxes_india
    - market_basics
    - glossary

market_data:
  provider: yfinance          # yfinance | alpha_vantage
  cache_ttl_minutes: 30
  max_retries: 3
  backoff_seconds: 2
  history_ttl_minutes: 240    # longer than cache_ttl_minutes: history changes slowly
  history_periods: [1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd, max]
  snapshot_path: src/data/market_snapshot.json

workflow:
  max_history_turns: 10

output_guard:
  patterns:                   # case-insensitive regexes, see architecture section 3.3
    - "you should (buy|sell|hold)"
    - "I recommend (buying|selling)"
    - "sell your"
    - "buy more"
  rewrite_prompt: |
    Rewrite the text below as neutral financial education. Do not tell the reader
    to buy, sell or hold anything. Keep the facts.

    {answer}
  safe_message: >
    I can explain how this works in general terms, but I can't give personal
    buy, sell or hold recommendations.

finance_qa:                   # Finance Q&A agent prompts and messages (architecture section 2.1)
  rewrite_max_chars: 120      # longer rewrites are cut at a word boundary (much longer = malformed, original is used)
  no_answer_sentinel: NO_ANSWER
  no_answer_message: >
    I couldn't find this in my knowledge base. I can explain topics such as
    stocks, bonds, ETFs and mutual funds, risk and diversification, saving and
    retirement goals, how markets work, and basic Indian savings and tax
    accounts. Try asking about one of these.
  rewrite_prompt: |
    Turn the question below into a short search query made of plain finance
    terms, as they would appear in a finance textbook. Reply with the query
    only: no quotes, no explanation, at most twelve words.

    Example: "will my pile last after my salary stops" -> retirement corpus withdrawal how long savings last

    If the question is not about money, finance or investing, return it unchanged.
    Never add finance words to a non-finance question.

    Question: {question}
  system_prompt: |
    You are a finance education assistant for beginners, with India-first examples.
    Answer ONLY from the numbered context below. Do not use outside knowledge.
    - Cite the context you used as [1], [2] right after the claim it supports.
    - If the context does not actually answer the question, even when the question
      is about finance (for example loans, crypto, insurance, credit scores or GST),
      reply with exactly NO_ANSWER and nothing else.
    - Educational only: explain how things work. Never tell the reader what to buy,
      sell or hold, and never give personal advice.
    - Do not state tax rates, limits or deadlines from memory; use only what the
      context says and point to the official source for current figures.
    - Use short, plain language that a beginner can follow.

portfolio:                    # Portfolio agent (architecture section 2.2). All values illustrative.
  max_holdings: 50            # holdings beyond this are ignored (bounds the number of quote calls)
  max_workers: 8              # quotes are fetched concurrently with at most this many threads
  full_diversification_holdings: 20   # equal positions in one currency that count as fully spread (HHI scaling)
  single_class_penalty: 15    # points taken off the diversification score when everything is one asset class
  concentration_warning: 0.40 # largest-position share (0-1) that adds a warning
  equity_like_classes: [equity, other]   # asset_class values counted in the equity share (unknown counts as risky)
  diversification_bands:      # diversification score (0-100)
    concentrated_below: 40
    diversified_from: 70
  risk:                       # risk label = the higher of the equity level and the concentration level
    equity_moderate_from: 0.40
    equity_high_from: 0.70
    concentration_moderate_from: 0.30
    concentration_high_from: 0.50
  needs_input_message: >
    Add at least one holding (ticker, quantity) to analyse your portfolio.
  unpriced_message: >
    I couldn't get a price for any of the holdings right now, so I can't
    analyse the portfolio. Please check the tickers or try again later.
  summary_fallback: >
    Here are the numbers calculated from your holdings: how the value is split,
    how concentrated the largest positions are, a diversification score, a risk
    label and the average fund cost where it was provided. A plain-language
    summary was not available this time, so please read the table directly.
    This is educational information, not personal advice.
  summary_prompt: |
    You are a finance education assistant explaining a portfolio to a beginner.
    Below is a JSON summary of numbers that were already calculated by software.
    Write a short plain-language summary in one paragraph (no lists, no headings).

    Rules:
    - Use ONLY numbers that appear in the JSON, copied exactly as written. Never
      calculate, round, convert or invent a number, and never convert currencies.
    - Each currency is a separate portfolio; never add them together.
    - Mention the concentration (the largest position), the diversification score
      and label, the risk label, and the expense ratio together with how much of
      the value and how many holdings it covers (use the coverage text exactly as
      written). If the expense ratio is "not provided", say that and give no
      coverage figures.
    - Describe what the numbers show, for example "the largest holding is 42.0%
      of the INR portfolio". This is educational information, not personal
      advice: never tell the reader to buy, sell, hold or rebalance anything and
      never say "you should".
    - If the JSON lists warnings (a missing price, or a stale or sample price),
      mention them briefly.

    JSON:
    {metrics_json}

market_analysis:              # Market agent (architecture section 2.3). All values illustrative.
  max_tickers: 4              # tickers beyond this are ignored (bounds the number of history calls)
  max_workers: 4              # histories are fetched concurrently with at most this many threads
  default_period: 6mo
  periods: [1mo, 3mo, 6mo, 1y]
  period_days:                # calendar days that each period covers (return, volatility, drawdown use this slice)
    1mo: 30
    3mo: 91
    6mo: 182
    1y: 365
  period_labels:              # wording for the summary
    1mo: 1 month
    3mo: 3 months
    6mo: 6 months
    1y: 1 year
  fetch_period: 1y            # one history call per ticker; SMAs and the 52-week range use all of it
  sma_windows: [20, 50]       # trading days: short first, long last (the trend label compares these two)
  trading_days: 252           # trading days per year, to annualise volatility
  week52_min_days: 350        # calendar days the fetched history must span to report the 52-week range
  short_history_tolerance_pct: 15   # history covering this much less than the period (percent) is flagged as short
  trend:
    return_threshold_pct: 3.0 # period return needed (up or down) for an Uptrend or Downtrend label
    sma_gap_pct: 0.5          # gap between the short and long average (percent of the long one) that counts as a difference
  needs_input_message: >
    Add at least one ticker (for example AAPL or RELIANCE.NS) to analyse.
  unavailable_message: >
    I couldn't get price history for any of the tickers right now, so I can't
    analyse them. Please check the tickers or try again later.
  summary_fallback: >
    Here are the numbers calculated from the price history: the latest price and
    daily change, the return over the selected period, moving averages,
    volatility, the largest fall from a peak and a trend label. A plain-language
    summary was not available this time, so please read the table directly.
    This is educational information, not a prediction or personal advice.
  summary_prompt: |
    You are a finance education assistant explaining recent price behaviour to a beginner.
    Below is a JSON summary of numbers that were already calculated by software.

    Format:
    - Write ONE short paragraph per ticker (two or three plain sentences), starting
      with the ticker name. Then add ONE short closing sentence, after all the
      paragraphs, that explains once what a moving average and a drawdown mean.
    - Use at most 3 numbers per ticker: the return over the period, how the price
      sits against the 20-day and 50-day averages (say above or below in words,
      with only one percentage), and the distance from the 52-week high.
    - Do not repeat every metric. Leave out the rest. Do not use lists, headings or
      semicolon-separated lists. Use plain beginner language.

    Rules:
    - Use ONLY numbers that appear in the JSON, copied exactly as written. Never
      calculate, round, convert or invent a number, and never convert currencies.
      Each ticker is reported in its own currency.
    - Describe what the numbers show, using observation wording, for example "the
      price is below its short-term average" or "the price fell from its peak
      during the period". Use the wording from the JSON for the averages and for
      the 52-week range, with the numbers exactly as written there.
    - If a ticker has "period_covered", its return, volatility and drawdown cover
      only that shorter span, not the whole analysis period: say so, and do not
      call it a return over the analysis period.
    - If there are several tickers, you may compare their numbers side by side, but
      never rank them or call one better or worse.
    - Never predict future prices, never say what will happen, and never tell the
      reader to buy, sell, hold or "consider" anything. This is educational
      information, not personal advice.
    - If the JSON lists warnings (a missing price, stale or sample data, or a
      metric that was left out), mention them briefly.

    JSON:
    {metrics_json}

goal_planning:                # Goal Planning agent (architecture section 2.4). All values are ILLUSTRATIVE, not predictions.
  currency: INR               # amounts are never converted
  inflation_adjust_default: true   # goal_params["inflation_adjust"] overrides it
  min_horizon_years: 1
  max_horizon_years: 40
  max_months: 600             # search limit for "months to reach the goal" (must cover max_horizon_years)
  max_step_up_pct: 15         # largest yearly increase of the monthly contribution
  max_amount: 1000000000000   # largest accepted amount (keeps the arithmetic finite)
  risk_profiles: [low, medium, high]
  scenarios: [conservative, expected, optimistic]   # lowest return first
  assumptions:
    label: Illustrative assumptions, not predictions or guaranteed returns.
    as_of: "2026-10-29"
    source: Illustrative planning assumptions chosen by the project author for teaching; not forecasts.
    returns_pct:              # annual EFFECTIVE return per risk profile
      low: {conservative: 4.0, expected: 6.0, optimistic: 8.0}
      medium: {conservative: 5.0, expected: 9.0, optimistic: 12.0}
      high: {conservative: 3.0, expected: 11.0, optimistic: 15.0}
    inflation:
      annual_pct: 5.0
      as_of: "2026-10-29"
      source: Illustrative planning assumptions chosen by the project author for teaching; not forecasts.
    deposit_timing_note: Deposits are assumed at the end of each month.
    step_up_note: A yearly step-up raises the monthly contribution every 12 months (from month 13).
    rate_note: Annual effective returns are converted to a monthly rate; nothing is guaranteed.
  labels:
    goal_future_money: Goal in future money (adjusted for inflation)
    projection_todays_money: Projection in today's money (adjusted for inflation)
  errors:
    not_a_number: "{field} must be a number."
    must_be_positive: "{field} must be greater than zero."
    must_not_be_negative: "{field} cannot be negative."
    too_large: "{field} is too large (the limit is {limit})."
    horizon_whole: "The horizon must be a whole number of years."
    horizon_range: "The horizon must be between {low} and {high} years."
    risk_profile: "The risk profile must be one of: {options}."
    step_up_range: "The yearly step-up must be between 0 and {limit} percent."
    inflation_flag: "inflation_adjust must be true or false."
  needs_input_message: "Please check the goal details before I can plan:"
  not_reached_note: "Not reached within {months} months at the current contribution."
  already_met_note: "The goal is already met by the current savings."
  summary_fallback: >
    The table shows how your savings could grow under three illustrative
    scenarios, how much you would need to save each month to reach the goal in
    each, and how long the current plan would take. These are illustrative
    assumptions, not predictions or guaranteed returns, and this is educational
    information, not personal advice.
  summary_prompt: |
    You are a finance education assistant explaining a savings-goal projection to a beginner.
    Below is a JSON summary of numbers that were already calculated by software.

    Format:
    - Write ONE short paragraph, then two or three short bullet lines (start each with "- ").
    - Plain beginner language. Describe what the numbers show; do not give advice.

    Rules:
    - Use ONLY numbers that appear in the JSON, copied exactly as written. Do not
      calculate, round, or invent a number, and do not convert any amount to
      lakh, crore or any other form (keep the western grouping with commas).
    - Say clearly that the results come from illustrative assumptions (see
      "assumptions") and are not predictions or guaranteed returns.
    - If "inflation" says it was applied, say which figures are in future money
      and which are in today's money, using the labels in the JSON.
    - Never predict future returns or markets, never recommend a product or fund,
      and never say "you should"; use observation wording such as "in the
      expected scenario the savings reach ..." or "a monthly amount of ... would
      be needed".
    - If a scenario says the goal is not reached, say so briefly.

    JSON:
    {results_json}

agents:
  error_message: "Sorry, something went wrong while preparing this answer. Please try again."
