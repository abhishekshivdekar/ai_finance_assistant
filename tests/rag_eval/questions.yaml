  - question: "I applied for a new issue and got nothing allotted, why does that happen?"
    expected: ["stocks/ipo-basics"]
  - question: "Why did a stock drop on the day the company paid out cash to its holders?"
    expected: ["stocks/dividends"]
  - question: "Does every listed company send profit money to the people who own it?"
    expected: ["stocks/dividends"]
  - question: "Is a company with a 5000 rupee share automatically bigger than one with a 50 rupee share?"
