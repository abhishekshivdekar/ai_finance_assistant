  - question: "Why does the price of a fund on the exchange sometimes differ from what its holdings are worth?"
    expected: ["etfs_and_funds/exchange-traded-funds-explained"]
  - question: "What does it mean when a fund just copies the Nifty instead of having someone pick companies?"
    expected: ["etfs_and_funds/index-funds-explained", "etfs_and_funds/active-versus-passive-investing"]
  - question: "Why doesn't my copy-the-market fund give exactly the same return as the market?"
    expected: ["etfs_and_funds/index-funds-explained"]
  - question: "How much does a fund quietly take from me every year for running things?"
    expected: ["etfs_and_funds/expense-ratio-explained"]
  - question: "Why does my friend say the direct version of a scheme earns more than the regular one?"
    expected: ["etfs_and_funds/expense-ratio-explained"]
  - question: "A fund unit costs 15 rupees and another costs 800, does the cheaper one give me more growth?"
    expected: ["etfs_and_funds/net-asset-value-nav-explained"]
  - question: "At what price do I get fund units if I invest in the afternoon?"
    expected: ["etfs_and_funds/net-asset-value-nav-explained"]
  - question: "Is putting a fixed sum in every month smarter than investing my whole bonus at once?"
