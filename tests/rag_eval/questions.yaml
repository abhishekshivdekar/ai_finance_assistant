  - question: "Who decides how likely a company is to repay what it borrowed from lenders?"
    expected: ["bonds/credit-ratings"]
  - question: "How does the government borrow money from ordinary people?"
    expected: ["bonds/government-securities-and-treasury-bills"]
  - question: "What are those 91 day papers the RBI sells at a discount?"
    expected: ["bonds/government-securities-and-treasury-bills"]
  - question: "Is lending to a company through a bond different from putting money in a bank deposit?"
    expected: ["bonds/bonds-versus-fixed-deposits"]
  - question: "Which is easier to take money out of early, a bank deposit or a bond?"
    expected: ["bonds/bonds-versus-fixed-deposits"]
  - question: "Can I lose money on debt instruments even if the company never misses a payment?"
