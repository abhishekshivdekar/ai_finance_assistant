  # --- risk_and_diversification batch 2 ---
  - question: "Why do investments that promise big gains also scare people so much?"
    expected: ["risk_and_diversification/risk-versus-return"]
  - question: "Is putting money in something super safe really without any downside?"
    expected: ["risk_and_diversification/risk-versus-return", "risk_and_diversification/inflation-risk-explained"]
  - question: "How many different companies do I need before I'm not too dependent on one of them?"
    expected: ["risk_and_diversification/diversification-explained"]
  - question: "I own five funds, am I properly spread out or is it all the same stuff?"
    expected: ["risk_and_diversification/diversification-explained", "risk_and_diversification/correlation-basics"]
  - question: "How do people decide what portion of their savings goes to shares versus fixed income?"
    expected: ["risk_and_diversification/asset-allocation-explained"]
  - question: "Does a young person with a steady job split savings differently from someone close to retirement?"
    expected: ["risk_and_diversification/asset-allocation-explained", "goals_and_retirement/setting-financial-goals"]
  - question: "What does it mean when two investments tend to move in opposite directions?"
    expected: ["risk_and_diversification/correlation-basics"]
  - question: "Why do all my holdings drop together when markets get scary even though I own different things?"
    expected: ["risk_and_diversification/correlation-basics", "risk_and_diversification/diversification-explained"]
  - question: "What do people mean when they say a stock is jumpy?"
    expected: ["risk_and_diversification/volatility-explained"]
  - question: "If something loses half its value, why is getting back to even so tough?"
    expected: ["risk_and_diversification/volatility-explained"]
  - question: "My savings earn 3 percent but groceries cost more every year, am I losing out?"
    expected: ["risk_and_diversification/inflation-risk-explained"]
  - question: "Why do older people say a hundred rupees used to buy so much more?"
    expected: ["risk_and_diversification/inflation-risk-explained"]
  - question: "My shares did great and now they are a bigger chunk of my savings than I planned, what do people do about that?"
    expected: ["risk_and_diversification/rebalancing-explained"]
  - question: "How often do investors reset their portfolio back to the original split?"
    expected: ["risk_and_diversification/rebalancing-explained"]

  # --- goals_and_retirement and accounts_and_taxes_india batch ---
