# near_miss: finance-adjacent questions the knowledge base does NOT cover;
# like off_topic they must match nothing above the threshold (counted separately).
near_miss:
  - "How does a home loan EMI work?"
  - "Is bitcoin a good investment?"
  - "Which insurance policy should I buy?"
  - "What is a credit score and how do I improve it?"
  - "How do I file my GST return?"

grid:
  chunk_size: [400, 600, 800]
  chunk_overlap: [60, 120]
  top_k: [1, 3, 4]
  threshold: [0.25, 0.35, 0.45]
