  - question: "How do people measure how big a listed business is?"
    expected: ["stocks/market-capitalisation"]
  - question: "My friend says a stock is trading at 25 times its yearly profit, what does that mean?"
    expected: ["stocks/price-to-earnings-ratio"]
  - question: "Why can't I judge a bank and a software firm using the same valuation multiple?"
    expected: ["stocks/price-to-earnings-ratio"]
  - question: "What do people mean by blue chip versus tiny companies on the stock market?"
    expected: ["stocks/large-mid-small-caps"]
  - question: "Why do the smallest listed companies jump around so much more than giants?"
    expected: ["stocks/large-mid-small-caps"]
  - question: "The news said the market was up 300 points today, what does that actually refer to?"
    expected: ["stocks/stock-indices-sensex-nifty"]
  - question: "How are Nifty 50 and Sensex different from each other?"
    expected: ["stocks/stock-indices-sensex-nifty"]
  # --- bonds batch ---
  - question: "A bond says 7 percent on it but my actual return looks different, why?"
